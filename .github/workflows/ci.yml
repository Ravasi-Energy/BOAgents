name: CI

# CI economy: work branches run through PRs; main runs after integration.
# The delivery branch codex/livrare-completa additionally runs on every push —
# exactly once per commit: when a PR is opened from that same branch, the
# pull_request jobs are skipped below so the push run stays the single run.
on:
  push:
    branches: [main, codex/livrare-completa]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ (github.head_ref || github.ref_name) != 'main' }}

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint & type check
    # Delivery-branch pushes run via `push`; a PR from the same branch would
    # duplicate that run, so PR events for it are skipped here.
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/livrare-completa'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      # docker/Dockerfile installs from uv.lock with `uv export --locked`, which
      # fails the deploy build if the lock is stale. `uv sync` below would
      # silently refresh a stale lock in this checkout, so check it first.
      - name: Check uv.lock is current
        run: cd packages/core && uv lock --check

      - name: Install dependencies
        run: cd packages/core && uv sync --extra dev

      - name: Run ruff
        run: cd packages/core && uv run ruff check openexecutive/

      - name: Run mypy
        run: cd packages/core && uv run mypy openexecutive/ --ignore-missing-imports

  python-test:
    name: Python tests
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/livrare-completa'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: cd packages/core && uv sync --extra dev

      - name: Run unit tests
        run: cd packages/core && uv run pytest tests/unit/ -v --tb=short --junitxml=/tmp/junit-unit.xml

      - name: Upload unit JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-${{ github.sha }}
          path: /tmp/junit-unit.xml
          if-no-files-found: warn

  ui-typecheck:
    name: UI type check
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/livrare-completa'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # UI checks run on every input that can change the browser workflows'
      # outcome (F10): the UI itself, this workflow's own definition (the
      # probes' infrastructure), and the backend HTTP surface the UI talks
      # to. A workflow-only commit MUST re-run the probes — otherwise the
      # run is green without ever executing them (observed on 28fabe7).
      # Docs-only pushes are already skipped by `paths-ignore: **/*.md`;
      # a pure core change with no UI/infra/API surface still skips the
      # Node toolchain entirely.
      - name: Detect UI-affecting changes
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "no usable base; running UI checks"
            exit 0
          fi
          git diff --name-only "$BASE"...HEAD
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(packages/ui/|\.github/workflows/|packages/core/openexecutive/api/)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.diff.outputs.ui == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npm ci

      - name: Type check
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npx tsc --noEmit

      # node:test suites added in #100. Runs on the same Node 22 the job
      # already uses (--experimental-strip-types needs 22.6+).
      - name: Run UI unit tests
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npm test

      - name: Build
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Chromium for permanent geometry regression
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npx playwright install --with-deps chromium

      # Ubuntu 24.04 runners blocheaza spatiile de nume neprivilegiate prin
      # AppArmor; fara aceasta optiune Chromium nu isi poate ridica sandbox-ul.
      # Mandatul cere sandbox REAL (fara --no-sandbox), deci reparam mediul,
      # nu oprim sandbox-ul.
      - name: Enable unprivileged user namespaces for Chromium sandbox
        if: steps.diff.outputs.ui == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: R01 October22 dependency regressions, real Chromium sandbox
        if: steps.diff.outputs.ui == 'true'
        run: |
          cd packages/ui
          mkdir -p "$BO_OCT22_OUTPUT"
          npm run --silent test:oct22-security > "$BO_OCT22_OUTPUT/JUNIT.xml"
        env:
          BO_OCT22_OUTPUT: ${{ runner.temp }}/bo-oct22-security

      - name: R01 October22 dependency evidence
        if: always() && steps.diff.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bo-oct22-security-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bo-oct22-security/JUNIT.xml
            ${{ runner.temp }}/bo-oct22-security/BROWSER.json
            ${{ runner.temp }}/bo-oct22-security/MERMAID-*.json
            ${{ runner.temp }}/bo-oct22-security/mermaid-*.png
          if-no-files-found: error

      - name: Reference geometry, real Chromium sandbox, three viewports
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npm run test:geometry
        env:
          BO_GEOMETRY_OUTPUT: ${{ runner.temp }}/bo-reference-geometry

      - name: Geometry evidence
        if: always() && steps.diff.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bo-reference-geometry-${{ github.sha }}
          path: ${{ runner.temp }}/bo-reference-geometry
          if-no-files-found: error

      - name: UI read failures, explicit retry and delayed-filter isolation
        if: steps.diff.outputs.ui == 'true'
        run: |
          mkdir -p "$BO_READ_ERROR_OUTPUT"
          cd packages/ui
          npm run --silent test:read-errors > "$BO_READ_ERROR_OUTPUT/JUNIT.xml"
        env:
          BO_READ_ERROR_OUTPUT: ${{ runner.temp }}/bo-read-errors

      - name: Read failure regression evidence
        if: always() && steps.diff.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bo-read-errors-${{ github.sha }}
          path: ${{ runner.temp }}/bo-read-errors
          if-no-files-found: error

      - name: Person identifiers, invalid aliases and missing record
        if: steps.diff.outputs.ui == 'true'
        run: |
          mkdir -p "$BO_PERSON_ROUTE_OUTPUT"
          cd packages/ui
          npm run --silent test:person-routes > "$BO_PERSON_ROUTE_OUTPUT/JUNIT.xml"
        env:
          BO_PERSON_ROUTE_OUTPUT: ${{ runner.temp }}/bo-person-routes

      - name: Person route regression evidence
        if: always() && steps.diff.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bo-person-routes-${{ github.sha }}
          path: ${{ runner.temp }}/bo-person-routes
          if-no-files-found: error

      - name: Review detail and note transport refusal
        if: steps.diff.outputs.ui == 'true'
        run: |
          mkdir -p "$BO_READ_ERROR_OUTPUT"
          cd packages/ui
          npm run --silent test:review-details > "$BO_READ_ERROR_OUTPUT/JUNIT.xml"
        env:
          BO_READ_ERROR_OUTPUT: ${{ runner.temp }}/bo-review-details

      - name: Review detail regression evidence
        if: always() && steps.diff.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bo-review-details-${{ github.sha }}
          path: ${{ runner.temp }}/bo-review-details
          if-no-files-found: error

      - name: Review actions, refusal, readback and lost acknowledgement
        if: steps.diff.outputs.ui == 'true'
        run: |
          mkdir -p "$BO_READ_ERROR_OUTPUT"
          cd packages/ui
          npm run --silent test:review-actions > "$BO_READ_ERROR_OUTPUT/JUNIT.xml"
          node scripts/ui-evidence.mjs actions "$BO_READ_ERROR_OUTPUT"
        env:
          BO_UI_SOURCE_SHA: ${{ github.sha }}
          BO_READ_ERROR_OUTPUT: ${{ runner.temp }}/bo-review-actions

      - name: Review action regression evidence
        if: always() && steps.diff.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bo-review-actions-${{ github.sha }}
          path: ${{ runner.temp }}/bo-review-actions
          if-no-files-found: error

      - name: Review corrections, file namespaces and refused mutation readback
        if: steps.diff.outputs.ui == 'true'
        run: |
          mkdir -p "$BO_READ_ERROR_OUTPUT"
          cd packages/ui
          npm run --silent test:review-changes > "$BO_READ_ERROR_OUTPUT/JUNIT.xml"
          node scripts/ui-evidence.mjs changes "$BO_READ_ERROR_OUTPUT"
        env:
          BO_UI_SOURCE_SHA: ${{ github.sha }}
          BO_READ_ERROR_OUTPUT: ${{ runner.temp }}/bo-review-changes

      - name: Review correction regression evidence
        if: always() && steps.diff.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bo-review-changes-${{ github.sha }}
          path: ${{ runner.temp }}/bo-review-changes
          if-no-files-found: error

      - name: Reference navigation during deferred content and diagram layout
        if: steps.diff.outputs.ui == 'true'
        run: |
          mkdir -p "$BO_READ_ERROR_OUTPUT"
          cd packages/ui
          npm run --silent test:reference-async > "$BO_READ_ERROR_OUTPUT/JUNIT.xml"
          node scripts/ui-evidence.mjs reference "$BO_READ_ERROR_OUTPUT"
        env:
          BO_UI_SOURCE_SHA: ${{ github.sha }}
          BO_READ_ERROR_OUTPUT: ${{ runner.temp }}/bo-reference-async

      - name: Reference asynchronous navigation evidence
        if: always() && steps.diff.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bo-reference-async-${{ github.sha }}
          path: ${{ runner.temp }}/bo-reference-async
          if-no-files-found: error

      # F02 needs the REAL FastAPI backend behind the real Next proxy — a
      # viewer role must be refused at the delegated-identity layer, with the
      # denial persisted in the on-disk audit log. That requires Python +
      # the synced core venv, not just Node.
      - name: Set up Python for the real backend
        if: steps.diff.outputs.ui == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.diff.outputs.ui == 'true'
        run: pip install uv

      - name: Install backend dependencies
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/core && uv sync --extra dev

      - name: Review role matrix through real proxy and persistent audit
        if: steps.diff.outputs.ui == 'true'
        run: |
          mkdir -p "$BO_READ_ERROR_OUTPUT"
          cd packages/ui
          npm run --silent test:review-roles > "$BO_READ_ERROR_OUTPUT/JUNIT.xml"
        env:
          BO_READ_ERROR_OUTPUT: ${{ runner.temp }}/bo-review-roles

      - name: Review role matrix regression evidence
        if: always() && steps.diff.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bo-review-roles-${{ github.sha }}
          path: ${{ runner.temp }}/bo-review-roles
          if-no-files-found: error
