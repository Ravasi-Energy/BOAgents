name: CI

on:
  push:
    branches: [main, 'bo/**']
  pull_request:
    branches: [main, 'bo/**']

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # docker/Dockerfile installs from uv.lock with `uv export --locked`, which
      # fails the deploy build if the lock is stale. `uv sync` below would
      # silently refresh a stale lock in this checkout, so check it first.
      - name: Check uv.lock is current
        run: cd packages/core && uv lock --check

      - name: Install dependencies
        run: cd packages/core && uv sync --extra dev

      - name: Run ruff
        run: cd packages/core && uv run ruff check openexecutive/

      - name: Run mypy
        run: cd packages/core && uv run mypy openexecutive/ --ignore-missing-imports

  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: cd packages/core && uv sync --extra dev

      - name: Run unit tests
        run: cd packages/core && uv run pytest tests/unit/ -v --tb=short

  ui-typecheck:
    name: UI type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # UI checks are gated on packages/ui actually changing — a core-only PR
      # skips the Node toolchain entirely instead of running an unrelated gate.
      - name: Detect UI changes
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "no usable base; running UI checks"
            exit 0
          fi
          git diff --name-only "$BASE"...HEAD
          if git diff --name-only "$BASE"...HEAD | grep -q '^packages/ui/'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.diff.outputs.ui == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npm ci

      - name: Type check
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npx tsc --noEmit

      # node:test suites added in #100. Runs on the same Node 22 the job
      # already uses (--experimental-strip-types needs 22.6+).
      - name: Run UI unit tests
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npm test

      - name: Build
        if: steps.diff.outputs.ui == 'true'
        run: cd packages/ui && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
